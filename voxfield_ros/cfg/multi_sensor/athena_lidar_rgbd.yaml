# Sensor configuration for the Athena robot's two Livox LiDARs plus its two
# RGB-D cameras (MULTI_SENSOR_PLAN.md §7.5, §8 Phase 8 step 4). Loaded
# together with athena_param.yaml by multi_sensor_mapping.launch.py, with
# `rgbd:=true` so the launch file's compressedDepth -> raw -> point cloud
# pipeline actually publishes `/athena/{front,back}_rgbd/points`.
#
# `fov_up`/`fov_down` for the two LiDARs are measured from the real bag
# (Phase 9 step 1) -- see athena_dual_lidar.yaml's comment for the numbers.
#
# Camera intrinsics (fx/fy/vx=cx/vy=cy) are read directly from this
# machine's bag (`/athena/{front,back}_rgbd/depth/camera_info`, §3 of the
# plan): 640x480, fx~=451.5/452.0, cx~=325.8/327.1, cy~=242.6/241.0 for
# front/back respectively. `sensor_is_lidar: false` and the camera's own
# width/height/fx/fy/vx/vy are per-sensor overrides (not top-level, unlike
# the two LiDARs' shared model) since they differ per sensor *and* differ
# in kind from the LiDARs' top-level defaults.
/**:
  ros__parameters:
    sensor_names: [front_lidar, back_lidar, front_rgbd, back_rgbd]
    sensor_is_lidar: true
    fov_up: 53.5
    fov_down: -8.0
    # 360 x 32 with normals on: chosen in Phase 9 step 5 (docs/
    # MULTI_SENSOR_NOTES.md). On the real bag it scores the same as 360 x 32
    # without normals and better than 1440 x 128 (74 % vs 66 % of raw
    # returns within 0.2 m of the mesh) at ~60 % of the integration
    # cost. athena_param.yaml doesn't set normal_available, so without
    # this line it would fall back to the library default, false. The
    # RGB-D cameras inherit it too; their dense depth images give normals
    # readily.
    width: 360
    height: 32
    normal_available: true
    sensors:
      front_lidar:
        topic: /athena/front_lidar/points_raw_livox
      back_lidar:
        topic: /athena/back_lidar/points_raw_livox
      front_rgbd:
        topic: /athena/front_rgbd/points
        sensor_is_lidar: false
        width: 640
        height: 480
        fx: 451.5
        fy: 451.5
        vx: 325.8
        vy: 242.6
        max_ray_length_m: 4.0
        min_time_between_msgs_sec: 0.4
      back_rgbd:
        topic: /athena/back_rgbd/points
        sensor_is_lidar: false
        width: 640
        height: 480
        fx: 452.0
        fy: 452.0
        vx: 327.1
        vy: 241.0
        max_ray_length_m: 4.0
        min_time_between_msgs_sec: 0.4
